# made by CasualArclamp
# Build and test on every push to main and every pull request, and on demand (Actions →
# CI → Run workflow, or `gh workflow run ci.yml`). After DecDRM's CI.
#
# The repository is public, so GitHub's runners cost nothing; docs-only pushes still
# skip CI.
#
# - test (Linux, Windows): the workspace's tests; clippy with warnings as errors (as in
#   CLAUDE.md); scripts/smoke-test.sh (the CLI runs, the GUI draws headless).
#
# Not here: the live HackRF tests (ignored; they need the radio) and anything that needs
# the IQ captures in captures/ (never committed). Real decoding joins the smoke test once
# the modulator (M2) can make a signal to decode.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: System packages (ALSA headers for cpal, libudev for the HackRF driver; Xvfb and Mesa for the GUI)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libasound2-dev libudev-dev pkg-config xvfb xauth libgl1-mesa-dri libegl1 libxkbcommon-x11-0
      - name: Mesa (software OpenGL for the GUI; the runners have no GPU)
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --release --all-targets
      - name: Test
        run: cargo test --workspace --release
      - name: Clippy
        run: cargo clippy --workspace --release --all-targets -- -D warnings
      - name: Smoke test
        shell: bash
        run: scripts/smoke-test.sh target/release "$RUNNER_TEMP/smoke"
      - name: Smoke test output (GUI screenshot)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ runner.os }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
