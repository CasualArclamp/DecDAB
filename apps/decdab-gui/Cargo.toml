# made by CasualArclamp
[package]
name = "decdab-gui"
description = "DecDAB desktop GUI (egui): DAB / DAB+ receiver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# eframe/egui 0.36 need Rust 1.95, so the GUI cannot keep the workspace MSRV.
rust-version = "1.95"

[[bin]]
name = "decdab-gui"
path = "src/main.rs"

[features]
# The HackRF driver is pure Rust (no SDK, no DLLs), so it is on by default.
default = ["hackrf"]
hackrf = ["decdab-io/hackrf"]

[dependencies]
decdab-core = { path = "../../crates/decdab-core" }
decdab-io = { path = "../../crates/decdab-io" }
decdab-engine = { path = "../../crates/decdab-engine" }
decdab-ofdm = { path = "../../crates/decdab-ofdm" }
decdab-fic = { path = "../../crates/decdab-fic" }
decdab-fec = { path = "../../crates/decdab-fec" }
decdab-data = { path = "../../crates/decdab-data" }
decdab-audio = { path = "../../crates/decdab-audio" }
anyhow.workspace = true
# The glow (OpenGL) renderer instead of eframe's default wgpu: plenty for 2-D
# plots and a much smaller build. "x11"/"wayland" only matter on Linux.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
# Native file dialogs (Win32 on Windows, XDG desktop portal on Linux).
rfd = "0.17.2"
# PNG output for --screenshot, and the slideshow's JPEG and PNG pictures.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }

# The icon in the Windows exe (needs the SDK's rc.exe; without it a warning).
[build-dependencies]
winresource = "0.1"

# A release exe has no console window; it attaches to the one that started it,
# if any, so `--version` and the like still print.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }

# With eframe's defaults off, re-enable winit's (Linux only) so building needs
# no X11/Wayland dev packages.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"
