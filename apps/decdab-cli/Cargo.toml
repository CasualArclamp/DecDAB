# made by CasualArclamp
[package]
name = "decdab-cli"
description = "DecDAB command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "decdab"
path = "src/main.rs"

[features]
# The Fobos, SDRplay and USRP (UHD, Windows) drivers load their maker's
# library at run time, so they build anywhere; the remote link is plain TCP.
default = ["hackrf", "airspy", "rtlsdr", "pluto", "fobos", "sdrplay", "uhd", "remote"]
hackrf = ["decdab-io/hackrf"]
airspy = ["decdab-io/airspy"]
rtlsdr = ["decdab-io/rtlsdr"]
pluto = ["decdab-io/pluto"]
fobos = ["decdab-io/fobos"]
sdrplay = ["decdab-io/sdrplay"]
uhd = ["decdab-io/uhd"]
remote = ["decdab-io/remote"]

[dependencies]
decdab-core = { path = "../../crates/decdab-core" }
decdab-io = { path = "../../crates/decdab-io" }
anyhow.workspace = true
rustfft.workspace = true
num-complex.workspace = true
clap = { version = "4.6", features = ["derive"] }
decdab-ofdm = { path = "../../crates/decdab-ofdm" }
decdab-fic = { path = "../../crates/decdab-fic" }
decdab-msc = { path = "../../crates/decdab-msc" }
decdab-codecs = { path = "../../crates/decdab-codecs" }
decdab-data = { path = "../../crates/decdab-data" }
decdab-engine = { path = "../../crates/decdab-engine" }
